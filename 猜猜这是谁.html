<style>
/* Layout: classroom projector. Big square "sticker" stage on the left, teacher controls and the answer on the right; stacks on phones. */
:root {
  --bg: #EEF0F8;
  --card: #FFFFFF;
  --ink: #1B1F3B;
  --muted: #5B6085;
  --accent: #2F3BDB;
  --accent-ink: #FFFFFF;
  --sun: #FFC83D;
  --line: #D3D7EA;
  --stage: #FFFFFF;
  --qmark: #DADDF3;
  --font-display: 'Noto Sans SC', 'Fredoka', system-ui, sans-serif;
  --font-ui: 'Fredoka', 'Noto Sans SC', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13152B;
    --card: #1C1F3D;
    --ink: #EDEEFA;
    --muted: #9AA0C8;
    --accent: #8E97FF;
    --accent-ink: #13152B;
    --sun: #FFD25E;
    --line: #2C305A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13152B;
  --card: #1C1F3D;
  --ink: #EDEEFA;
  --muted: #9AA0C8;
  --accent: #8E97FF;
  --accent-ink: #13152B;

}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);

  font-size: 16px;
  line-height: 1.5;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; text-wrap: balance; }
.top .py { margin: 4px 0 0; color: var(--muted); font-size: 15px; letter-spacing: .02em; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink);
  font-family: var(--font-ui); font-weight: 700; font-size: 19px; cursor: pointer; position: relative;
}
.tab[aria-current="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
.tab.has::after { content: ""; position: absolute; right: 4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); border: 1.5px solid var(--ink); }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
@media (min-width: 880px) { .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; } }

.stage-col { padding-right: 12px; padding-bottom: 12px; }
.stage {
  position: relative; width: min(100%, 70vh, 640px); aspect-ratio: 1; max-width: 100%;
  background: var(--stage); border: 3px solid var(--ink); border-radius: 22px; overflow: hidden;
  box-shadow: 10px 10px 0 var(--accent); container-type: inline-size;
}
.qmark {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 900; font-size: 58cqw; line-height: 1; color: var(--qmark); user-select: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.empty {
  position: absolute; inset: 14px; border: 3px dashed var(--line); border-radius: 14px; background: var(--stage);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 16px;

}

.btn {

.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.tab:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, .empty:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 3px;
}

.settings { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
select {

.check { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; min-height: 42px; cursor: pointer; }

kbd { font-family: var(--font-ui); font-size: 13px; background: var(--card); border: 1.5px solid var(--line); border-radius: 6px; padding: 1px 7px; }

/* teacher setup */
details.setup { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 4px 18px; }
details.setup summary { cursor: pointer; font-family: var(--font-display); font-weight: 900; font-size: 17px; padding: 12px 0; }

<script>
(function () {
  var DEFAULTS = [
    { zh: '皮卡丘', py: 'Píkǎqiū' },
    { zh: '大耳狗', py: 'Dà’ěrgǒu' },
    { zh: '蒙奇奇', py: 'Méngqíqí' },
    { zh: '库洛米', py: 'Kùluòmǐ' },
    { zh: '凯蒂猫', py: 'Kǎidìmāo' },
    { zh: '哆啦A梦', py: 'Duōlā A mèng' },
    { zh: '海绵宝宝', py: 'Hǎimián Bǎobao' },
    { zh: '美乐蒂', py: 'Měilèdì' }
  ];
  var N = DEFAULTS.length;
  var SLIDES = DEFAULTS.map(function (d) { return { zh: d.zh, py: d.py }; });
  try {
    var saved = JSON.parse(localStorage.getItem('guess-who-names-v2') || 'null');
    if (Array.isArray(saved)) saved.forEach(function (s, i) {
      if (i < N && s && typeof s.zh === 'string' && typeof s.py === 'string') SLIDES[i] = { zh: s.zh, py: s.py };
    });
  } catch (e) {}
  function saveNames() { try { localStorage.setItem('guess-who-names-v2', JSON.stringify(SLIDES)); } catch (e) {} }

  var S = 800;
  var imgs = [], urls = [];
  for (var q = 0; q < N; q++) { imgs.push(null); urls.push(null); }
  var cur = 0, p = 0, playing = false, last = null, raf = 0;

  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d');
  var small = document.createElement('canvas'), sctx = small.getContext('2d');
  var stage = $('stage'), empty = $('empty'), answer = $('answer');
  var playBtn = $('play'), scrub = $('scrub'), modeSel = $('mode'), durSel = $('dur'), auto = $('auto');
  var rows = $('rows'), tabs = $('tabs'), setup = $('setup');

  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
  var ICON_AGAIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';

  /* ---------- storage (best effort) ---------- */
  function openDb() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('guess-who', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('img'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
  }
  function dbPut(k, blob) { return openDb().then(function (db) { db.transaction('img', 'readwrite').objectStore('img').put(blob, k); }).catch(function () {}); }
  function dbDel(k) { return openDb().then(function (db) { db.transaction('img', 'readwrite').objectStore('img').delete(k); }).catch(function () {}); }
  function dbGet(k) {
    return openDb().then(function (db) {
      return new Promise(function (res) {
        var r = db.transaction('img').objectStore('img').get(k);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }

  /* ---------- images ---------- */
  function setImage(i, blob, persist) {
    return new Promise(function (resolve) {
      if (!blob || !/^image\//.test(blob.type || 'image/')) { resolve(false); return; }
      var url = URL.createObjectURL(blob);
      var im = new Image();
      im.onload = function () {
        if (urls[i]) URL.revokeObjectURL(urls[i]);
        urls[i] = url; imgs[i] = im;
        if (persist) dbPut(i, blob);
        resolve(true);
      };
      im.onerror = function () { URL.revokeObjectURL(url); resolve(false); };
      im.src = url;
    });
  }
  function clearImage(i) {
    if (urls[i]) URL.revokeObjectURL(urls[i]);
    urls[i] = null; imgs[i] = null; dbDel(i);
  }

  function drawContain(c, im, size) {
    var pad = size * 0.06;
    var k = Math.min((size - pad * 2) / im.naturalWidth, (size - pad * 2) / im.naturalHeight);
    var w = im.naturalWidth * k, h = im.naturalHeight * k;
    c.drawImage(im, (size - w) / 2, (size - h) / 2, w, h);
  }

  function draw(pp) {
    var im = imgs[cur];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, S, S);
    if (!im) return;
    if (modeSel.value === 'pixel' && pp < 1) {
      var n = Math.max(4, Math.round(4 * Math.pow(S / 4, pp)));
      small.width = n; small.height = n;
      sctx.fillStyle = '#fff'; sctx.fillRect(0, 0, n, n);
      sctx.imageSmoothingEnabled = true;
      drawContain(sctx, im, n);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(small, 0, 0, S, S);
      ctx.imageSmoothingEnabled = true;
    } else {
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      drawContain(ctx, im, S);
    }
  }

  function applyEffect(pp) {
    var m = modeSel.value, mask = '', filter = '';
    if (m === 'blur' && pp < 1) {
      filter = 'blur(' + (Math.pow(1 - pp, 1.5) * stage.clientWidth * 0.11).toFixed(2) + 'px)';
    } else if (m === 'wipe' && pp < 1) {
      var r = pp * 106 - 6;
      mask = 'linear-gradient(to top, #000 ' + r.toFixed(2) + '%, transparent ' + (r + 6).toFixed(2) + '%)';
    } else if (m === 'circle' && pp < 1) {
      var R = pp * 108 - 8;
      mask = 'radial-gradient(circle at 50% 50%, #000 ' + R.toFixed(2) + '%, transparent ' + (R + 8).toFixed(2) + '%)';
    }
    cv.style.filter = filter;
    cv.style.webkitMaskImage = mask;
    cv.style.maskImage = mask;
  }

  function update() {
    draw(p);
    applyEffect(p);
    scrub.value = Math.round(p * 1000);
  }

  /* ---------- playback ---------- */
  function dur() { return parseFloat(durSel.value) || 20; }
  function tick(t) {
    if (!playing) return;
    if (last === null) { last = t; raf = requestAnimationFrame(tick); return; }
    var dt = (t - last) / 1000; last = t;
    p = Math.min(1, p + dt / dur());
    update();
    if (p >= 1) { playing = false; syncPlay(); }
    else raf = requestAnimationFrame(tick);
  }
  function play() {
    if (!imgs[cur]) return;
    if (p >= 1) p = 0;
    playing = true; last = null;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
    syncPlay();
  }
  function pause() {
    playing = false; cancelAnimationFrame(raf); syncPlay();
  }
  function syncPlay() {
    var has = !!imgs[cur];
    playBtn.disabled = !has; scrub.disabled = !has;
    $('replay').disabled = !has; $('ans').disabled = !has;
    if (playing) playBtn.innerHTML = ICON_PAUSE + '暂停';
    else if (p >= 1) playBtn.innerHTML = ICON_AGAIN + '再看一次';
    else if (p > 0) playBtn.innerHTML = ICON_PLAY + '继续';
    else playBtn.innerHTML = ICON_PLAY + '开始';
  }

  function showAnswer(on) {
    answer.hidden = !on;
    $('ans').textContent = on ? '隐藏答案' : '公布答案';
    if (on) {
      $('aZh').textContent = SLIDES[cur].zh;
      $('aPy').textContent = 'Zhè shì ' + SLIDES[cur].py + '.';
      answer.classList.remove('reveal-in'); void answer.offsetWidth; answer.classList.add('reveal-in');
    }
  }

  function render() {
    empty.hidden = !!imgs[cur];
    var btns = tabs.children;
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-current', i === cur ? 'true' : 'false');
      btns[i].classList.toggle('has', !!imgs[i]);
    }
    update(); syncPlay(); renderRows();
  }

  function go(i) {
    cur = (i + N) % N;
    pause(); p = 0; showAnswer(false);
    render();
    if (imgs[cur] && auto.checked) play();
  }

  function restart() {
    pause(); p = 0; showAnswer(false); update(); syncPlay();
    if (imgs[cur]) play();
  }

  /* ---------- setup rows ---------- */
  function renderRows() {
    var focusedId = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('txt') ? document.activeElement.id : null;
    if (focusedId) return; /* don't rebuild while the teacher is typing */
    rows.innerHTML = '';
    SLIDES.forEach(function (s, i) {
      var li = document.createElement('li');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;

      var zh = document.createElement('input'); zh.type = 'text'; zh.className = 'txt'; zh.id = 'zh' + i; zh.value = s.zh; zh.setAttribute('aria-label', '第 ' + (i + 1) + ' 张的名字');
      zh.addEventListener('input', function () { SLIDES[i].zh = zh.value; saveNames(); if (i === cur && !answer.hidden) showAnswer(true); });
      var py = document.createElement('input'); py.type = 'text'; py.className = 'txt'; py.id = 'py' + i; py.value = s.py; py.setAttribute('aria-label', '第 ' + (i + 1) + ' 张的拼音');
      py.addEventListener('input', function () { SLIDES[i].py = py.value; saveNames(); if (i === cur && !answer.hidden) showAnswer(true); });

      var st = document.createElement('span'); st.className = 'st' + (imgs[i] ? ' ok' : ''); st.textContent = imgs[i] ? '已放入' : '尚未放入';
      var pick = document.createElement('label'); pick.className = 'btn small'; pick.style.cursor = 'pointer';
      pick.textContent = imgs[i] ? '换图' : '选择图片';
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.className = 'sr'; inp.id = 'file' + i;
      inp.addEventListener('change', function () { if (inp.files[0]) loadInto(i, inp.files[0]); });
      pick.appendChild(inp);
      li.appendChild(n); li.appendChild(zh); li.appendChild(py); li.appendChild(st); li.appendChild(pick);
      if (imgs[i]) {
        var del = document.createElement('button'); del.type = 'button'; del.className = 'btn small'; del.textContent = '清除';
        del.addEventListener('click', function () { clearImage(i); if (i === cur) { pause(); p = 0; showAnswer(false); } render(); });
        li.appendChild(del);
      }
      rows.appendChild(li);
    });
  }

  function loadInto(i, file) {
    setImage(i, file, true).then(function (ok) {
      if (!ok) return;
      if (i === cur) { pause(); p = 0; showAnswer(false); render(); if (auto.checked) play(); }
      else render();
    });
  }

  /* ---------- wiring ---------- */
  for (var t = 0; t < N; t++) (function (i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.textContent = i + 1; b.setAttribute('aria-label', '第 ' + (i + 1) + ' 张');
    b.addEventListener('click', function () { go(i); });
    tabs.appendChild(b);
  })(t);

  playBtn.addEventListener('click', function () { playing ? pause() : play(); });
  $('replay').addEventListener('click', restart);
  $('ans').addEventListener('click', function () {
    if (answer.hidden) { pause(); p = 1; update(); syncPlay(); showAnswer(true); }
    else showAnswer(false);
  });
  $('prev').addEventListener('click', function () { go(cur - 1); });
  $('next').addEventListener('click', function () { go(cur + 1); });
  scrub.addEventListener('input', function () { pause(); p = scrub.value / 1000; update(); syncPlay(); });
  modeSel.addEventListener('change', update);
  window.addEventListener('resize', update);

  $('one').addEventListener('change', function (e) { if (e.target.files[0]) loadInto(cur, e.target.files[0]); e.target.value = ''; });
  empty.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('one').click(); } });

  $('bulk').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files).filter(function (f) { return /^image\//.test(f.type); });
    files.sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
    files = files.slice(0, N);
    Promise.all(files.map(function (f, i) { return setImage(i, f, true); })).then(function () {
      pause(); p = 0; showAnswer(false); render();
      if (imgs[cur] && auto.checked) play();
    });
    e.target.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.remove('drag'); });
  });
  stage.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadInto(cur, f);
  });

  $('fs').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen().catch(function () {}); }
    } catch (err) {}
  });

  window.addEventListener('keydown', function (e) {
    var el = e.target, tag = el && el.tagName;
    if (tag === 'SELECT' || (tag === 'INPUT' && el.type !== 'range' && el.type !== 'checkbox')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if ((k === ' ' || k === 'Enter') && (tag === 'BUTTON' || tag === 'LABEL' || tag === 'SUMMARY')) return;
    if (k === ' ') { e.preventDefault(); playing ? pause() : play(); }
    else if (k === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
    else if (k === 'a' || k === 'A' || k === 'Enter') { $('ans').click(); }
    else if (k === 'r' || k === 'R') { restart(); }
  });

  /* ---------- start ---------- */
  render();
  setup.open = true;
  Promise.all(DEFAULTS.map(function (_, i) {
    return dbGet(i).then(function (b) { return b ? setImage(i, b, false) : false; });
  })).then(function () {
    setup.open = !imgs.every(Boolean);
    render();
    if (imgs[cur] && auto.checked) play();
  });
})();
</script>
